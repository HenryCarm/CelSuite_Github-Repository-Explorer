name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.x }
      - name: Publish single-file exe
        run: |
          cd wrappers/win
          dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o out
          mkdir ..\..\dist
          copy out\CelSuiteRepoExplorer.exe ..\..\dist\CelSuite-RepoExplorer-Windows-Portable.exe
          cd out
          powershell Compress-Archive -Path * -DestinationPath ..\..\..\dist\CelSuite-RepoExplorer-Windows-Standalone.zip
      - uses: actions/upload-artifact@v4
        with: { name: win, path: dist/* }
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: system deps
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev wget file
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: wrappers/linux
          args: --bundles appimage,deb
      - name: collect
        run: |
          mkdir -p dist
          cp wrappers/linux/target/release/bundle/appimage/*.AppImage dist/CelSuite-RepoExplorer-Linux-Portable.bin
          cp wrappers/linux/target/release/bundle/deb/*.deb dist/CelSuite-RepoExplorer-Linux-Standalone.deb
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: dist/* }
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Build signed APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KS_PASS }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          cd wrappers/android
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore
          export KS_FILE=$PWD/release.keystore
          ./gradlew assembleRelease
          mkdir -p ../../dist
          cp app/build/outputs/apk/release/app-release.apk "../../dist/CelSuite-RepoExplorer-${GITHUB_REF_NAME}.apk"
      - uses: actions/upload-artifact@v4
        with: { name: android, path: dist/* }
  publish:
    needs: [win, linux, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: add web assets
        run: |
          cp app/index.html "dist/CelSuite-RepoExplorer-${GITHUB_REF_NAME}.html"
          cd app && zip -r "../dist/CelSuite-RepoExplorer-${GITHUB_REF_NAME}-Portable.zip" . && cd ..
      - name: size floors (fail loud, never ship empties)
        run: |
          test $(stat -c%s dist/CelSuite-RepoExplorer-Windows-Portable.exe) -gt 1000000
          test $(stat -c%s dist/CelSuite-RepoExplorer-Linux-Portable.bin) -gt 2000000
          test $(stat -c%s dist/CelSuite-RepoExplorer-*.apk) -gt 400000
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "CelSuite GitHub Repository Explorer ${{ github.ref_name }}"
          body_path: RELEASE_NOTES.md
          files: dist/*
