[package]
name = "celsuite-repo-explorer"
version = "269.26.3"
description = "CelSuite GitHub Repository Explorer"
authors = ["HenryJayz"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
